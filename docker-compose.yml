# Nodos del cluster. Cada notebook levanta solo su profile:
#   notebook A: --profile a      (7000, 7001, 7002)
#   notebook B: --profile b      (7003, 7004, 7005)
#   escalado:   --profile extra  (7006, en la notebook A)
# Los puertos se mapean 1 a 1 y cada nodo anuncia la IP real de la notebook
# (HOST_IP en .env), así los nodos de la otra máquina pueden encontrarlo.

version: "3.9"

x-redis: &redis
  image: redis:7.2
  restart: "no"

services:
  redis-7000:
    <<: *redis
    container_name: redis-7000
    profiles: ["a"]
    command: >-
      redis-server /usr/local/etc/redis/redis.conf --port 7000
      --cluster-announce-ip ${HOST_IP:?Falta HOST_IP en .env}
      --cluster-announce-port 7000 --cluster-announce-bus-port 17000
    ports: ["7000:7000", "17000:17000"]
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - datos-7000:/data

  redis-7001:
    <<: *redis
    container_name: redis-7001
    profiles: ["a"]
    command: >-
      redis-server /usr/local/etc/redis/redis.conf --port 7001
      --cluster-announce-ip ${HOST_IP:?Falta HOST_IP en .env}
      --cluster-announce-port 7001 --cluster-announce-bus-port 17001
    ports: ["7001:7001", "17001:17001"]
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - datos-7001:/data

  redis-7002:
    <<: *redis
    container_name: redis-7002
    profiles: ["a"]
    command: >-
      redis-server /usr/local/etc/redis/redis.conf --port 7002
      --cluster-announce-ip ${HOST_IP:?Falta HOST_IP en .env}
      --cluster-announce-port 7002 --cluster-announce-bus-port 17002
    ports: ["7002:7002", "17002:17002"]
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
