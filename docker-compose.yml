  redis-7003:
    <<: *redis
    container_name: redis-7003
    profiles: ["b"]
    command: >-
      redis-server /usr/local/etc/redis/redis.conf --port 7003
      --cluster-announce-ip ${HOST_IP:?Falta HOST_IP en .env}
      --cluster-announce-port 7003 --cluster-announce-bus-port 17003
    ports: ["7003:7003", "17003:17003"]
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - datos-7003:/data

  redis-7004:
    <<: *redis
    container_name: redis-7004
    profiles: ["b"]
    command: >-
      redis-server /usr/local/etc/redis/redis.conf --port 7004
      --cluster-announce-ip ${HOST_IP:?Falta HOST_IP en .env}
      --cluster-announce-port 7004 --cluster-announce-bus-port 17004
    ports: ["7004:7004", "17004:17004"]
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - datos-7004:/data

  redis-7005:
    <<: *redis
    container_name: redis-7005
    profiles: ["b"]
    command: >-
      redis-server /usr/local/etc/redis/redis.conf --port 7005
      --cluster-announce-ip ${HOST_IP:?Falta HOST_IP en .env}
      --cluster-announce-port 7005 --cluster-announce-bus-port 17005
    ports: ["7005:7005", "17005:17005"]
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - datos-7005:/data

  redis-7006:
    <<: *redis
    container_name: redis-7006
    profiles: ["extra"]
    command: >-
      redis-server /usr/local/etc/redis/redis.conf --port 7006
      --cluster-announce-ip ${HOST_IP:?Falta HOST_IP en .env}
      --cluster-announce-port 7006 --cluster-announce-bus-port 17006
    ports: ["7006:7006", "17006:17006"]
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - datos-7006:/data

volumes:
  datos-7000:
  datos-7001:
  datos-7002:
  datos-7003:
  datos-7004:
  datos-7005:
  datos-7006:
