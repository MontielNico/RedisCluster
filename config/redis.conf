# Configuración común a todos los nodos.
# El puerto y la IP anunciada se pasan por línea de comandos (docker-compose.yml).

bind 0.0.0.0
protected-mode no

cluster-enabled yes
cluster-config-file nodes.conf
# Tiempo sin respuesta para considerar caído un nodo (ms). Bajo para que la demo sea ágil.
cluster-node-timeout 5000

appendonly yes
dir /data
